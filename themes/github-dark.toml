# GitHub dark (Primer) theme for EagleView, the default look.
# Pick it with [view] theme = "github-dark" or the Settings > Theme menu.

[theme]
background = "#0d1117"    # diagram canvas
header = "#010409"        # top bar
panel = "#0d1117"         # outline pane
divider = "#30363d"
text = "#e6edf3"
dim = "#8b949e"
error = "#f85149"
selection = "#1f6feb"     # selected node border, highlighted edges
selection_row = "#388bfd26"
hover_row = "#b1bac40f"
grid = "#151a21"
cursor = "#2f81f7"         # code editor
text_selection = "#388bfd55"
find_match = "#bb800966"
current_line = "#6e76811a"

[theme.outline]           # GitHub dark syntax colors (code editor)
package = "#79c0ff"
import = "#8b949e"
comment = "#8b949e"
definition = "#d2a8ff"
usage = "#e6edf3"
relationship = "#7ee787"
behavior = "#ffa657"
expression = "#a5d6ff"
keyword = "#ff7b72"

[theme.node]              # nodes are neutral cards; only the «keyword» is colored
header = "#161b22"
fill = "#0d1117"
border = "#30363d"
hover_border = "#6e7681"
separator = "#21262d"
name = "#e6edf3"
compartment = "#b1bac4"
shadow = "#01040966"
definition = "#d29922"
usage = "#4493f8"
behavior = "#ab7df8"
requirement = "#3fb950"

[theme.edge]              # accents blended into the canvas so lines stay quiet
specialization = "#8b949e"
typing = "#6e7681"
composition = "#3a6aa2"
satisfy = "#30873f"
dependency = "#6e4fa9"
connection = "#8b949e"
flow = "#3a869a"
allocation = "#9a6a2e"
label = "#8b949e"

