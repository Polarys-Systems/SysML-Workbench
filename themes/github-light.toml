# GitHub light (Primer) theme for EagleView.
# Pick it with [view] theme = "github-light" or the Settings > Theme menu.
# Only colors are set here.

[theme]
border = "#d0d7de"
text = "#1f2328"
text_muted = "#656d76"
error = "#cf222e"
success = "#1a7f37"
accent = "#0969da"
selection_row = "#0969da14"
hover_row = "#d0d7de33"
grid = "#f3f5f7"
cursor = "#0969da"
text_selection = "#0969da33"
find_match = "#d4a72c66"
current_line = "#eaeef280"

[theme.bg]                # surfaces, from the window inwards
app = "#f6f8fa"         # behind the panels
panel = "#ffffff"       # code editor, model tree
canvas = "#ffffff"      # diagram
bar = "#f6f8fa"         # menu bar, header, toolbars, popups

[theme.syntax]           # GitHub light syntax colors
package = "#0550ae"
import = "#656d76"
comment = "#6e7781"
definition = "#8250df"
usage = "#1f2328"
relationship = "#116329"
behavior = "#953800"
expression = "#0a3069"
keyword = "#cf222e"

[theme.node]
header = "#f6f8fa"
fill = "#ffffff"
border = "#d0d7de"
hover_border = "#8c959f"
separator = "#d8dee4"
name = "#1f2328"
compartment = "#424a53"
shadow = "#1f23280f"

[theme.kind]              # fg: badge letter, keyword, outline; bg: tinted fill
package = { fg = "#0550ae", bg = "#0550ae24" }
import = { fg = "#656d76", bg = "#656d7624" }
comment = { fg = "#6e7781", bg = "#6e778124" }
definition = { fg = "#9a6700", bg = "#9a670024" }
usage = { fg = "#0969da", bg = "#0969da24" }
relationship = { fg = "#116329", bg = "#11632924" }
behavior = { fg = "#8250df", bg = "#8250df24" }
requirement = { fg = "#1a7f37", bg = "#1a7f3724" }
expression = { fg = "#0a3069", bg = "#0a306924" }

[theme.edge]
specialization = "#6e7781"
typing = "#8c959f"
composition = "#6b9ad6"
satisfy = "#5fa872"
dependency = "#a68be0"
connection = "#57606a"
flow = "#1b7c83"
allocation = "#9a6700"
label = "#656d76"

[theme.glass]
fill = "#ffffffd9"
bar = "#f6f8facc"
border = "#d0d7de"
highlight = "#ffffffff"
shadow = "#1f232826"
control = "#eaeef2"
control_active = "#ffffff"
